    <div class="container">

        </div>

        <p class="description">

        <h2 class="section-title">💬 Espace d'échange</h2>

        <!-- Zone d'affichage des messages -->
        <div id="messagesList">
            <p style="color: #777;">Chargement des messages...</p>
        </div>

        <!-- Formulaire d'ajout de message -->
        <div class="form-card">
            <h3>Ajouter un message</h3>
            <form id="forumForm">
                <div class="form-group">
                    <input type="text" id="forumAuthor" class="form-control" value="David" placeholder="Votre nom" required>

                <div class="form-group">
                    <textarea id="forumMessage" class="form-control" placeholder="Écrivez votre message ici..." required></textarea>

                <button type="submit" id="btnSubmit" class="btn-submit">Publier le message</button>
                <div id="forumStatus"></div>
            </form>
        </div>
    </div>

    <!-- Script Supabase -->
    <script>
        const SUPABASE_URL = 'https://ctshdbkocntodhxtxafr.supabase.co';[cite: 9]
        const SUPABASE_KEY = 'sb_publishable_CsP6jpQNiAnju_EjsE1XJw_eaJT4pKz';
        const SECTION_ID = 'nyxetdavid';

        const HEADERS = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
        };

        async function loadMessages() {
            const listDiv = document.getElementById('messagesList');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/commentaires?section=eq.${SECTION_ID}&select=*&order=created_at.desc`, {
                    headers: HEADERS
                });
                const data = await res.json();

                if (!res.ok) {
                    listDiv.innerHTML = `<p style="color: red;">Erreur de chargement (${res.status})</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    listDiv.innerHTML = '<p style="color: #777;">Aucun message pour le moment.</p>';
                    return;
                }

                listDiv.innerHTML = data.map(item => `
                    <div style="background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                            <strong style="color: #24292e;">${escapeHtml(item.auteur)}</strong>
                            <small style="color: #586069;">${new Date(item.created_at).toLocaleString('fr-FR')}</small>
                        </div>
                        <div style="color: #24292e; white-space: pre-wrap;">${escapeHtml(item.message)}</div>
                    </div>
                `).join('');
            } catch (err) {
                listDiv.innerHTML = `<p style="color: red;">Erreur réseau : ${err.message}</p>`;
            }
        }

        document.getElementById('forumForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const statusDiv = document.getElementById('forumStatus');
            const btn = document.getElementById('btnSubmit');
            
            const auteur = document.getElementById('forumAuthor').value;
            const message = document.getElementById('forumMessage').value;

            btn.disabled = true;
            statusDiv.style.color = '#333';
            statusDiv.innerText = 'Publication en cours...';

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/commentaires`, {
                    method: 'POST',
                    headers: HEADERS,
                    body: JSON.stringify({
                        section: SECTION_ID,
                        auteur: auteur,
                        message: message
                    })
                });

                if (res.ok) {
                    statusDiv.style.color = 'green';
                    statusDiv.innerText = 'Message publié avec succès !';
                    document.getElementById('forumMessage').value = '';
                    await loadMessages();
                } else {
                    const errData = await res.json();
                    statusDiv.style.color = 'red';
                    statusDiv.innerText = `Échec d'enregistrement (${res.status}) : ${JSON.stringify(errData)}`;
                }
            } catch (err) {
                statusDiv.style.color = 'red';
                statusDiv.innerText = `Erreur réseau : ${err.message}`;
            } finally {
                btn.disabled = false;
            }
        });

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        loadMessages();
    </script>
</body>
